<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 916 232" width="916" height="232" role="img" aria-label="Two training tracks that meet on the same cluster. Upper: PyTorch and TensorFlow through Autotrainer for distributed training. Lower: HuggingFace through LoRA, LoReFT and PEFT adapters in 4-bit. Both converge on Slurm with DDP and FSDP and run on the GPUs.">
<title>Two tracks, one cluster</title>
<style>
