<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 244" width="1128" height="244" role="img" aria-label="The full path a model takes. Training: model and data split into PyTorch with Autotrainer for distributed training, and HuggingFace with LoRA, LoReFT and PEFT adapters; both converge on Slurm across GPU nodes, guided by SlurmGenie. Serving: quantization and pruning through vLLM, ONNX, and GGUF, and RAG and agent pipelines on FAISS, Ollama, and LangChain; both converge on InfraSight for traces and evals, and are served.">
<title>What I work on — model to metal to served</title>
<style>
  .bx{fill:#121B2D;stroke:#26334A;stroke-width:1}
  .lb{fill:#8B9BB8;font-family:"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;font-weight:500}
  .sb{fill:#7C8AA4;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:8.5px;letter-spacing:.7px}
  .ph{fill:#7C8AA4;font-family:ui-monospace,Menlo,monospace;font-size:9px;letter-spacing:1.5px}
  .wire{stroke:#26334A;stroke-width:1.5;fill:none} .tip{fill:#26334A}
  .dv{stroke:#26334A;stroke-width:1;stroke-dasharray:2 4}
  .dash{stroke-dasharray:2 3}
  .mine,.obs{fill:#332F2B;stroke:#FFB020}  .lmine,.lobs{fill:#FFB020;font-weight:700} .smine,.sobs{fill:#FFC97A}
  .tune,.rag{fill:#241F45;stroke:#7B5CFF}  .ltune,.lrag{fill:#B9A8FF;font-weight:650} .stune,.srag{fill:#A899E8}
  .live{fill:#15333F;stroke:#2EE6D6}       .llive{fill:#2EE6D6;font-weight:600} .slive{fill:#7FD8D0}
  .opt{fill:#3A1F2E;stroke:#FF3D8B}        .lopt{fill:#FF8FB8;font-weight:650} .sopt{fill:#E88BAC}
</style>
<rect x="0" y="0" width="1128" height="244" rx="6" fill="#0D1422" stroke="#26334A"/>
<line class="dv" x1="660" y1="34" x2="660" y2="212"/>
<text class="ph" x="24" y="24">TRAIN</text>
<text class="ph" x="674" y="24">SERVE</text>

<!-- Input -->
<rect class="bx" x="24" y="110" width="116" height="52" rx="3"/>
<text class="lb" x="82.0" y="141" text-anchor="middle">Model · Data</text>

<!-- Input to Frameworks wire -->
<line class="wire" x1="140" y1="136" x2="150" y2="136"/>
<line class="wire" x1="150" y1="104" x2="150" y2="168"/>
<line class="wire" x1="150" y1="104" x2="156" y2="104"/>
<path class="tip" d="M162 104 l-7 -4 v8 z"/>
<line class="wire" x1="150" y1="168" x2="156" y2="168"/>
<path class="tip" d="M162 168 l-7 -4 v8 z"/>

<!-- Frameworks -->
<rect class="bx" x="166" y="78" width="116" height="52" rx="3"/>
<text class="lb" x="224.0" y="109" text-anchor="middle">PyTorch · TF</text>
<rect class="bx" x="166" y="142" width="116" height="52" rx="3"/>
<text class="lb" x="224.0" y="173" text-anchor="middle">HuggingFace</text>

<!-- Frameworks to Training Tools wire -->
<line class="wire" x1="282" y1="104" x2="296" y2="104"/>
<path class="tip" d="M302 104 l-7 -4 v8 z"/>
<line class="wire" x1="282" y1="168" x2="296" y2="168"/>
<path class="tip" d="M302 168 l-7 -4 v8 z"/>

<!-- Training Tools (Autotrainer & LoRA) -->
<rect class="bx mine" x="306" y="78" width="136" height="52" rx="3"/>
<text class="lb lmine" x="374.0" y="101" text-anchor="middle">Autotrainer</text>
<text class="sb smine" x="374.0" y="118" text-anchor="middle">distributed training</text>

<rect class="bx tune" x="306" y="142" width="136" height="52" rx="3"/>
<text class="lb ltune" x="374.0" y="165" text-anchor="middle">LoRA · LoReFT</text>
<text class="sb stune" x="374.0" y="182" text-anchor="middle">PEFT · 4-bit</text>

<!-- Training Tools to Cluster wire -->
<line class="wire" x1="442" y1="104" x2="456" y2="104"/>
<path class="tip" d="M462 104 l-7 -4 v8 z"/>
<line class="wire" x1="442" y1="168" x2="456" y2="168"/>
<path class="tip" d="M462 168 l-7 -4 v8 z"/>

<!-- Cluster & Copilot (Slurm & SlurmGenie) -->
<rect class="bx live" x="466" y="78" width="154" height="52" rx="3"/>
<text class="lb llive" x="543.0" y="101" text-anchor="middle">Slurm · DDP · FSDP</text>
<text class="sb slive" x="543.0" y="118" text-anchor="middle">GPU · Multi-Node</text>

<rect class="bx mine" x="466" y="142" width="154" height="52" rx="3"/>
<text class="lb lmine" x="543.0" y="165" text-anchor="middle">SlurmGenie</text>
<text class="sb smine" x="543.0" y="182" text-anchor="middle">cluster copilot</text>
<line class="wire dash" x1="543" y1="130" x2="543" y2="142"/>

<!-- Cluster to Serve Transition wire -->
<line class="wire" x1="620" y1="104" x2="636" y2="104"/>
<line class="wire" x1="620" y1="168" x2="636" y2="168"/>
<line class="wire" x1="636" y1="104" x2="636" y2="168"/>
<line class="wire" x1="636" y1="136" x2="676" y2="136"/>
<line class="wire" x1="676" y1="104" x2="676" y2="168"/>
<line class="wire" x1="676" y1="104" x2="682" y2="104"/>
<path class="tip" d="M688 104 l-7 -4 v8 z"/>
<line class="wire" x1="676" y1="168" x2="682" y2="168"/>
<path class="tip" d="M688 168 l-7 -4 v8 z"/>

<!-- Serving & Retrieval -->
<rect class="bx opt" x="692" y="78" width="156" height="52" rx="3"/>
<text class="lb lopt" x="770.0" y="101" text-anchor="middle">Quantize · Prune</text>
<text class="sb sopt" x="770.0" y="118" text-anchor="middle">vLLM · ONNX · GGUF</text>

<rect class="bx rag" x="692" y="142" width="156" height="52" rx="3"/>
<text class="lb lrag" x="770.0" y="165" text-anchor="middle">RAG · Agents</text>
<text class="sb srag" x="770.0" y="182" text-anchor="middle">FAISS · Ollama · LangChain</text>

<!-- Serving to InfraSight wire -->
<line class="wire" x1="848" y1="104" x2="860" y2="104"/>
<line class="wire" x1="848" y1="168" x2="860" y2="168"/>
<line class="wire" x1="860" y1="104" x2="860" y2="168"/>
<line class="wire" x1="860" y1="136" x2="872" y2="136"/>
<path class="tip" d="M878 136 l-7 -4 v8 z"/>

<!-- Observability (InfraSight) -->
<rect class="bx obs" x="882" y="110" width="120" height="52" rx="3"/>
<text class="lb lobs" x="942.0" y="133" text-anchor="middle">InfraSight</text>
<text class="sb sobs" x="942.0" y="150" text-anchor="middle">traces · evals</text>

<!-- InfraSight to Served wire -->
<line class="wire" x1="1002" y1="136" x2="1018" y2="136"/>
<path class="tip" d="M1024 136 l-7 -4 v8 z"/>

<!-- Served -->
<rect class="bx" x="1028" y="110" width="76" height="52" rx="3"/>
<text class="lb" x="1066.0" y="141" text-anchor="middle">Served</text>
