<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 961 210" width="961" height="210" role="img" aria-label="Two training tracks that meet on the same cluster. Upper: PyTorch and TensorFlow through Autotrainer. Lower: HuggingFace through LoRA, LoReFT and PEFT adapters. Both converge on Slurm with DDP and FSDP and run on the GPUs.">
