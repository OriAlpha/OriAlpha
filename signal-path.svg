<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 244" width="1128" height="244" role="img" aria-label="The full path a model takes. Training: model and data split into PyTorch with Autotrainer for distributed training, and HuggingFace with LoRA, LoReFT and PEFT adapters; both converge on Slurm across GPU nodes. Serving: quantization and pruning through ONNX and TVM, and RAG and agent pipelines on FAISS and Ollama; both converge on InfraSight for traces and evals, and are served.">
<title>Model to metal to served</title>
<style>
  .bx{fill:#121B2D;stroke:#26334A;stroke-width:1}
  .lb{fill:#8B9BB8;font-family:"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;font-weight:500}
  .sb{fill:#7C8AA4;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:8.5px;letter-spacing:.7px}
  .ph{fill:#7C8AA4;font-family:ui-monospace,Menlo,monospace;font-size:9px;letter-spacing:1.5px}
  .wire{stroke:#26334A;stroke-width:1.5;fill:none} .tip{fill:#26334A}
  .dv{stroke:#26334A;stroke-width:1;stroke-dasharray:2 4}
  .mine,.obs{fill:#332F2B;stroke:#FFB020}  .lmine,.lobs{fill:#FFB020;font-weight:700} .smine,.sobs{fill:#FFC97A}
  .tune,.rag{fill:#241F45;stroke:#7B5CFF}  .ltune,.lrag{fill:#B9A8FF;font-weight:650} .stune,.srag{fill:#A899E8}
  .live{fill:#15333F;stroke:#2EE6D6}       .llive{fill:#2EE6D6;font-weight:600} .slive{fill:#7FD8D0}
  .opt{fill:#3A1F2E;stroke:#FF3D8B}        .lopt{fill:#FF8FB8;font-weight:650} .sopt{fill:#E88BAC}
</style>
