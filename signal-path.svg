  .sb{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:8.5px;letter-spacing:.08em;font-weight:400;fill:#7C8AA4}
  .tune{fill:#241F45;stroke:#7B5CFF} .ttune{fill:#B9A8FF;font-weight:650} .stune{fill:#A899E8}
  .mine{fill:#332F2B;stroke:#FFB020} .tmine{fill:#FFB020;font-weight:700}   .smine{fill:#FFC66A}
  .live{fill:#15333F;stroke:#2EE6D6} .tlive{fill:#2EE6D6;font-weight:600}
